name: bis2-tmp
on:
  push:
    branches: [bis2-tmp]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [model_switch, route_selector, half_a, half_b, half_c]
    steps:
      - uses: actions/checkout@v4
        with: { ref: 18cd53da66eafa62cc26710fee9659e6cf8d1e1a }
      - name: Remove target tests
        shell: bash
        run: |
          ALL=$(git diff --name-only 6c2be1710d753c29cf8e4d244683add8b5fd8719 HEAD 2>/dev/null | grep '^apps/mobile/test/' || true)
          # fallback: hardcoded list of 19 since 6c2be171 ref may not be local
          if [ -z "$ALL" ]; then
            ALL="apps/mobile/test/app-setup-screen.test.tsx apps/mobile/test/appearance-contrast.test.ts apps/mobile/test/appearance-material.test.ts apps/mobile/test/appearance-model.test.ts apps/mobile/test/appearance-store.test.ts apps/mobile/test/appearance-wallpaper-pick.test.ts apps/mobile/test/cloud-connections-screen.test.tsx apps/mobile/test/credentials-screen.test.tsx apps/mobile/test/host-app-setup.test.ts apps/mobile/test/host-cloud.test.ts apps/mobile/test/host-credentials.test.ts apps/mobile/test/host-settings-screen.test.tsx apps/mobile/test/host-settings.test.ts apps/mobile/test/model-switch-display.test.ts apps/mobile/test/root-alert-insets.test.tsx apps/mobile/test/route-selector.test.tsx apps/mobile/test/settings-home.test.ts apps/mobile/test/settings-sheet.test.tsx apps/mobile/test/usage-screen.test.tsx"
          fi
          case "${{ matrix.target }}" in
            model_switch) rm -f apps/mobile/test/model-switch-display.test.ts;;
            route_selector) rm -f apps/mobile/test/route-selector.test.tsx;;
            half_a) for f in $(echo "$ALL"|head -6); do rm -f "$f"; done;;
            half_b) for f in $(echo "$ALL"|sed -n '7,12p'); do rm -f "$f"; done;;
            half_c) for f in $(echo "$ALL"|tail -7); do rm -f "$f"; done;;
          esac
          echo "removed for ${{ matrix.target }}"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: root tsc
        run: npx tsc --noEmit 2>&1 | tee /tmp/o.txt || true
      - name: count
        run: |
          grep -oE 'error TS[0-9]+: .*' /tmp/o.txt | sed -E 's/\([0-9]+,[0-9]+\)//' | sort -u > /tmp/o.set || true
          echo "ROOT_ERRORS[${{ matrix.target }}]=$(wc -l < /tmp/o.set)"
